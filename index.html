<!DOCTYPE html>
<html>
    <head>
        <title>Quiz App</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style1.css">
        <link rel="stylesheet" href="generalstyle.css">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
        <script src="script1.js" defer></script>
    </head>
    <body>
        <div class="container">
            <div class="screen  active" id="start-screen">
                <h1>Quiz Time!</h1>
                <p>Test your knowledge with these fun questions</p>
                <button id="start-btn">Start Quiz</button>
            </div>
            <div class="screen" id="quiz-screen">
                <div class="quiz-header">
                    <h2 id="question-text">Question Goes Here!</h2>
                    <div class="quiz-info">
                        <p>
                            Question <span id="current-question">1</span> of <span id="question-length"> 5</span>
                        </p>
                        <p>
                            Score: <span id="score">0</span>
                        </p>
                    </div>
                    <div id="answers-container" class="answers-container">
                        <!-- Answer Buttons goes here -->
                    </div>
                    <div class="progress-bar">
                        <div id="progress" class="progress"></div>
                    </div>
                </div>
            </div>
            <div class="screen" id="result-screen">
                    <h1>Quiz Result</h1>
                    <div class="result-info">
                        <p>
                            You Scored <span id="final-score">0</span> out of <span id="question-length">5</span>
                        </p>
                        <div id="result-msg">Good Job!</div>
                    </div>
                    <button id="restart-btn">Restart Quiz</button>
            </div>
        </div>
        <br>
        <i class="fa fa-bars" onclick="document.getElementById('navlink-div').style.left='0px'"></i>
        <div id="navlink-div">
            <h3>All Projects<i class="fa fa-close" onclick="document.getElementById('navlink-div').style.left='-500px'"></i></h3>
            <ul class="navlink-ul">
                <li><a href="index.html">Quiz App</a></li>
                <li><a href="index2.html">Color Palette Generator</a></li>
                <li><a href="index2.html">Color Palette Generator</a></li>
                <li><a href="index2.html">Color Palette Generator</a></li>
                <li><a href="index2.html">Color Palette Generator</a></li>
            </ul>
        </div>
    </body>
</html>
